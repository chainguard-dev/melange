name: Fetch and extract external object into workspace

needs:
  packages:
    - wget

inputs:
  strip-components:
    description: |
      The number of path components to strip while extracting.
    default: 1

  directory:
    description: |
      The directory to extract the artifact into (passed to `tar -C`)
    default: .

  extract:
    description: |
      Whether to extract the downloaded artifact as a source tarball.
    default: true

  expected-sha256:
    description: |
      The expected SHA256 of the downloaded artifact.

  expected-sha512:
    description: |
      The expected SHA512 of the downloaded artifact.

  expected-none:
    description: |
      There is no expected checksum.

  purl-name:
    description: |
      package-URL (PURL) name for use in SPDX SBOM External References
    default: ${{package.name}}

  purl-version:
    description: |
      package-URL (PURL) version for use in SPDX SBOM External References
    default: ${{package.version}}

  uri:
    description: |
      The URI to fetch as an artifact.
    required: true

  timeout:
    description: |
      The timeout (in seconds) to use for connecting and reading.
      The fetch will fail if the timeout is hit.
    default: 5

  dns-timeout:
    description: |
      The timeout (in seconds) to use for DNS lookups.
      The fetch will fail if the timeout is hit.
    default: 20

  retry-limit:
    description: |
      The number of times to retry fetching before failing.
    default: 5

  delete:
    description: |
      Whether to delete the fetched artifact after unpacking.
    default: false

  reason:
    description: |
      Provide reason why fetch is used, instead of git-checkout

pipeline:
  - runs: |
      if [ -z "${{inputs.expected-sha256}}" ] && [ -z "${{inputs.expected-sha512}}" ] && [ -z "${{inputs.expected-none}}" ]; then
        printf "One of expected-sha256 or expected-sha512 is required\n"
        exit 1
      fi

      # the URI, spliced into the script once
      uri_in='${{inputs.uri}}'
      bn=$(basename "$uri_in")

      if [ -n "${{inputs.expected-sha256}}" ]; then
        fn="/var/cache/melange/sha256:${{inputs.expected-sha256}}"
        if [ -f $fn ]; then
          printf "fetch: found $fn in cache\n"
          cp $fn $bn
        fi
      elif [ -n "${{inputs.expected-sha512}}" ]; then
        fn="/var/cache/melange/sha512:${{inputs.expected-sha512}}"
        if [ -f $fn ]; then
          printf "fetch: found $fn in cache\n"
          cp $fn $bn
        fi
      elif [ -n "${MELANGE_SOURCE_RESTORE:-}" ]; then
        # No checksum to look the artifact up by. A -source companion names
        # such an artifact by the SHA-256 of what was fetched and records the
        # URL beside it (below); find it by that URL, and take it only if its
        # bytes still hash to its name, so a rebuild from the companion needs
        # no network for it either. Nothing but the record vouches for the
        # bytes, so only a build that asked to restore from a companion --
        # whose cache the pin in the binary package has verified -- looks;
        # an ordinary build with a cache it did not vet fetches as before.
        uri=$(printf '%s\n' "$uri_in" | sed -e 's|://[^/?#]*@|://|' -e 's|[?#].*$||')
        for u in /var/cache/melange/sha256:*.uri; do
          [ -f "$u" ] || continue
          [ "$(head -n 1 "$u")" = "$uri" ] || continue
          fn="${u%.uri}"
          if [ -f "$fn" ] && [ "sha256:$(sha256sum "$fn" | awk '{print $1}')" = "$(basename "$fn")" ]; then
            printf "fetch: found $fn in cache, by its URL\n"
            cp "$fn" "$bn"
            break
          fi
        done
      fi

      if [ ! -f $bn ]; then
        wget '-T${{inputs.timeout}}' '--dns-timeout=${{inputs.dns-timeout}}' '--tries=${{inputs.retry-limit}}' --random-wait --retry-connrefused --continue "$uri_in"
      fi

      if [ -n "${{inputs.expected-none}}" ]; then
        printf "fetch: Checksum validation skipped\n"
      elif [ -n "${{inputs.expected-sha256}}" ]; then
        printf "fetch: Expected sha256: ${{inputs.expected-sha256}}\n"
        sum=$(sha256sum $bn | awk '{print $1}')
        if [ "${{inputs.expected-sha256}}" != "$sum" ]; then
          printf "fetch: Expected sha256 does not match found: $sum\n"
          exit 1
        fi
      else
        printf "fetch: Expected sha512: ${{inputs.expected-sha512}}\n"
        sum=$(sha512sum $bn | awk '{print $1}')
        if [ "${{inputs.expected-sha512}}" != "$sum" ]; then
          printf "fetch: Expected sha512 does not match found: $sum\n"
          exit 1
        fi
      fi

      # When the build emits a -source companion, keep the verified artifact
      # for it, named exactly as the cache above names it: the companion's
      # upstream directory is then a valid --cache-dir for an offline rebuild.
      if [ -n "${MELANGE_SOURCE_STASH:-}" ]; then
        if [ -n "${{inputs.expected-sha256}}" ]; then
          key="sha256:${{inputs.expected-sha256}}"
        elif [ -n "${{inputs.expected-sha512}}" ]; then
          key="sha512:${{inputs.expected-sha512}}"
        else
          key="sha256:$(sha256sum $bn | awk '{print $1}')"
        fi
        mkdir -p "$MELANGE_SOURCE_STASH"
        cp "$bn" "$MELANGE_SOURCE_STASH/$key"
        # the URL as provenance: scheme, host and path only, since userinfo,
        # query and fragment are where credentials travel
        printf '%s\n' "$uri_in" | sed -e 's|://[^/?#]*@|://|' -e 's|[?#].*$||' > "$MELANGE_SOURCE_STASH/$key.uri"
        # Whether the artifact was obtained with credentials, recorded as
        # $key.credentials: one "<signal> <host>" line for each way wget would
        # send them, never a value. A publisher that serves source publicly
        # refuses a companion holding any such file. wget's debug output
        # prints headers unredacted, so the signals come from the URL and
        # wget's configuration instead, which also covers an artifact the
        # cache supplied without a fetch: userinfo in the URL; a query
        # parameter whose name looks like a credential (a substring match, so
        # it fails closed); a netrc entry for the host, compared
        # case-insensitively, or a default one; any other netrc entry, as
        # "netrc -", since wget follows redirects to hosts the URL does not
        # name; a user, password, header, cookie file, client certificate or
        # key in a wgetrc, whose command names wget reads ignoring case, "-"
        # and "_". wget reads only ~/.netrc (not $NETRC). A record that came
        # with a cached artifact is kept.
        host=$(printf '%s\n' "$uri_in" | sed -e 's|^[^:/?#]*://||' -e 's|[/?#].*$||' -e 's|^.*@||' -e 's|:[0-9]*$||')
        creds=$(mktemp)
        {
          if printf '%s\n' "$uri_in" | grep -q '^[^:/?#]*://[^/?#]*@'; then
            echo "userinfo $host"
          fi
          if printf '%s\n' "$uri_in" | sed -n -e 's|#.*$||' -e 's|^[^?]*?||p' | tr '&;' '\n\n' | sed 's|=.*$||' |
              grep -Eiq 'token|key|sig|secret|auth|pass|cred|jwt'; then
            echo "query $host"
          fi
          f="${HOME:-/root}/.netrc"
          if [ -f "$f" ]; then
            awk -v h="$host" 'BEGIN { h = tolower(h) }
              { for (i = 1; i <= NF; i++) {
                  if ($i == "default" || ($i == "machine" && tolower($(i + 1)) == h)) own = 1
                  else if ($i == "machine") other = 1 } }
              END { if (own) print "netrc", h; else if (other) print "netrc -" }' "$f"
          fi
          for f in "${SYSTEM_WGETRC:-/etc/wgetrc}" "${WGETRC:-${HOME:-/root}/.wgetrc}"; do
            if [ -f "$f" ] && awk '/^[[:space:]]*#/ || index($0, "=") == 0 { next }
                { k = tolower(substr($0, 1, index($0, "=") - 1)); gsub(/[-_[:space:]]/, "", k) }
                k ~ /^(header|user|password|httpuser|httppassword|httppasswd|ftpuser|ftppassword|ftppasswd|askpassword|useaskpass|loadcookies|certificate|privatekey)$/ { found = 1 }
                END { exit !found }' "$f"; then
              echo "wgetrc $host"
            fi
          done
          if [ -n "${fn:-}" ] && [ -f "$fn.credentials" ]; then
            cat "$fn.credentials"
          fi
        } | LC_ALL=C sort -u > "$creds"
        if [ -s "$creds" ]; then
          cp "$creds" "$MELANGE_SOURCE_STASH/$key.credentials"
          printf 'fetch: Warning: %s was obtained with credentials (%s); recorded in %s.credentials for the -source package\n' \
            "$key" "$(awk 'NR > 1 { printf ", " } { printf "%s", $0 }' "$creds")" "$key"
        fi
        rm -f "$creds"
        printf "fetch: kept $key for the -source package\n"
      fi

      if [ "${{inputs.extract}}" = "true" ]; then
        tar -x '--strip-components=${{inputs.strip-components}}' --no-same-owner -C '${{inputs.directory}}' -f $bn
      fi

      if [ "${{inputs.delete}}" = "true" ]; then
        rm $bn
      fi
