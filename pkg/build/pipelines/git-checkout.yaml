name: Check out sources from git

needs:
  packages:
    - git

inputs:
  repository:
    description: |
      The repository to check out sources from.
    required: true
  destination:
    description: |
      The path to check out the sources to.
    default: .
  depth:
    description: |
      The depth to use when cloning. Use -1 to get full branch history.
      If 'branch' and 'expected-commit' are provided the default is -1.
      Otherwise, default is to use '1' (shallow clone).
    default: unset
  branch:
    description: |
      The branch to check out, otherwise HEAD is checked out.
      For reproducibility, tag is generally favored over branch.
      Branch and tag are mutually exclusive.
  tag:
    description: |
      The tag to check out.  Branch and tag are mutually exclusive.
  expected-commit:
    description: |
      The expected commit hash
  expected-commit-is-branch-tip:
    description: |
      When "true", require that expected-commit exactly matches the tip of
      the checked-out branch instead of allowing any older commit on the
      branch.  Use this when a branch is used as an immutable release pointer
      (e.g. version-named release branches) so that a stale expected-commit --
      for example after bumping the version but forgetting to update the
      commit -- fails loudly instead of silently checking out old code.
      Only valid together with 'branch'; mutually exclusive with 'tag'.
    default: "false"
  recurse-submodules:
    description: |
      Indicates whether --recurse-submodules should be passed to git clone.
    default: false
  shallow-submodules:
    description: |
      Whether to use --shallow-submodules when recurse-submodules is true.
      Ignored if recurse-submodules is false.
    default: false
  submodule-jobs:
    description: |
      The number of concurrent jobs to use when recurse-submodules is true.
      Ignored if recurse-submodules is false.
    default: 1
  cherry-picks:
    description: |
      List of cherry picks to apply.
      New line separated entries.
      Lines can be empty.
      Any content on a line after `#` is ignored.
      After removing comments, each line is of the form:

          [branch/]commit-id: comment explaining cherry-pick

      comment and commit-id are required.  branch on origin that
      the commit lives should be provided or git is not guaranteed to
      have a reference to the commit-id.

        Example:
          cherry-picks: |
            3.10/62705d869aca4055e8a96e2ed4f9013e9917c661:
  type-hint:
    description: |
      Type hint to use during SBOM generation for the provided
      git repository. This is primarily used to identify Gitlab
      based sources which are not heuristically identifiable as
      Gitlab.  Supported hints: gitlab.
  sparse-paths:
    description: |
      List of directory paths to checkout when using sparse-checkout (cone mode).
      This is useful for monorepos where you only need specific subdirectories.
      When specified, only these directories will be checked out from the repository.
      Uses cone mode for optimal performance.
      Example:
        sparse-paths:
          - omnibump
          - shared/lib
  max-retries:
    description: |
      Maximum number of retry attempts for git clone operation on failure.
    default: "3"
  initial-backoff:
    description: |
      Initial backoff duration in seconds before first retry.
    default: "2"
  max-backoff:
    description: |
      Maximum backoff duration in seconds between retries.
    default: "60"
  reason:
    description: |
      Provide reason for a mutable reference.

pipeline:
  - runs: |
      #!/bin/sh
      # shellcheck shell=busybox
      set -eu

      msg() { echo "[git checkout]" "$@"; }
      fail() { msg FAIL "$@"; exit 1; }
      vr() { msg "execute:" "$@"; "$@"; }

      # Retry function with exponential backoff and jitter
      retry_with_backoff() {
          local max_retries=$1
          local initial_backoff=$2
          local max_backoff=$3
          shift 3
          local attempt=0
          local backoff=$initial_backoff

          while [ $attempt -le "$max_retries" ]; do
              if [ $attempt -gt 0 ]; then
                  msg "Retry attempt $attempt/$max_retries after ${backoff}s backoff..."
              fi

              if "$@"; then
                  return 0
              fi

              attempt=$((attempt + 1))
              if [ $attempt -gt "$max_retries" ]; then
                  msg "All $max_retries retry attempts exhausted"
                  return 1
              fi

              # Calculate jitter: random value between 0 and backoff
              # Using $RANDOM (bash built-in) or fallback to basic arithmetic
              local jitter=0
              if [ -n "$RANDOM" ]; then
                  jitter=$((RANDOM % (backoff + 1)))
              else
                  # Fallback: use process ID as pseudo-random seed
                  jitter=$((($$ * attempt) % (backoff + 1)))
              fi

              local sleep_time=$((backoff + jitter))
              msg "Waiting ${sleep_time}s before retry (backoff: ${backoff}s, jitter: ${jitter}s)..."
              sleep $sleep_time

              # Exponential backoff: double the backoff time
              backoff=$((backoff * 2))
              if [ $backoff -gt "$max_backoff" ]; then
                  backoff=$max_backoff
              fi
          done

          return 1
      }

      process_cherry_picks() {
        local cpicksf="$1" count=0
        local fetched_branches=""
        local sdate=${SOURCE_DATE_EPOCH:-0}
        if [ "$sdate" -lt 315532800 ]; then
            msg "Setting commit date to Jan 1, 1980 (SOURCE_DATE_EPOCH found ${SOURCE_DATE_EPOCH:-(not set)})"
            sdate=315532800
        fi
        if [ -z "$cpicksf" ]; then
            return 0
        fi
        if [ ! -f "$cpicksf" ]; then
            msg "cherry picks input '$cpicksf' is not a file"
            return 1
        fi

        local line="" branch="" hash="" comment="" unshallow_arg is_shallow
        while IFS= read -r line; do
            # Drop anything after #
            line=${line%%#*}
            [ -z "$line" ] && continue
            # Ensure the line contains ':'
            if ! echo "$line" | grep -q ':'; then
                msg "Invalid format, expected '[branch/]commit: comment'. Found: $line"
                return 1
            fi
            # Split the line into branch/hash and comment parts
            branch=${line%%:*}
            comment=${line#*:}
            # shellcheck disable=SC2086
            comment=$(set -f; echo $comment) # Strip leading/trailing whitespace

            if [ -z "$comment" ]; then
                msg "Empty comment for cherry-pick: $line"
                return 1  # or continue to skip this cherry-pick
            fi
            # Extract commit hash
            hash=${branch##*/}
            # If branch information exists, strip it off to just leave the branch name
            [ "$branch" != "$hash" ] && branch=${branch%/*} || branch=""

            unshallow_arg=""
            is_shallow=$(git rev-parse --is-shallow-repository)
            if [ "$is_shallow" = "true" ] ; then
                unshallow_arg="--unshallow"
            fi

            if [ -n "$branch" ]; then
                case " $fetched_branches " in
                    *" $branch "*) ;;
                    *) vr git fetch $unshallow_arg origin "$branch:$branch" || {
                        msg "failed to fetch branch $branch"
                        return 1
                        }
                        fetched_branches="$fetched_branches $branch ";;
                esac
            fi

            vr env \
                GIT_COMMITTER_DATE="@$sdate" \
                git cherry-pick -x "$hash" || {
                msg "failed to cherry-pick $hash from branch $branch"
                return 1
            }

            msg "Cherry-picked $hash from $branch with comment: $comment"

            count=$((count + 1))
        done < "$cpicksf"

        if [ $count -gt 0 ]; then
            msg "applied $count cherry-pick(s). head is now $(git rev-parse HEAD)"
        fi
      }

      # Archive the HEAD tree of the repository at $1 as the clone has it:
      # every path, unsubstituted. The attributes override in info/attributes
      # outranks the tree's own .gitattributes, so export-ignore and
      # export-subst do not apply; a clone's work tree has neither. tar.umask
      # records 644/755 like a clone under the build umask, not git's default
      # 664/775. git archive uses the commit time and gzip -n drops the header
      # timestamp, so the bytes are reproducible.
      archive_tree() {
          local dir=$1 prefix=$2 out=$3 attrs="" had=""
          attrs="$(git -C "$dir" rev-parse --absolute-git-dir)/info/attributes"
          mkdir -p "${attrs%/*}"
          [ -f "$attrs" ] && had=1 && cp "$attrs" "$attrs.melange-save"
          printf '* -export-ignore -export-subst\n' >> "$attrs"
          ( set -o pipefail; git -C "$dir" -c tar.umask=022 archive --format=tar --prefix="$prefix" HEAD | gzip -n > "$out" )
          local rc=$?
          if [ -n "$had" ]; then mv "$attrs.melange-save" "$attrs"; else rm -f "$attrs"; fi
          return $rc
      }

      # Pack the tree objects (no blobs) of the given commits: kilobytes to a
      # few megabytes that let the restore path recreate the index exactly
      # and check every file against the blob the pinned commit names for
      # it, whatever git's clean filters would make of its bytes.
      stash_trees() {
          local dir=$1 out=$2 c=""
          shift 2
          for c in "$@"; do
              git -C "$dir" rev-parse "$c^{tree}"
              git -C "$dir" ls-tree -r -d "$c" | awk '$2 == "tree" { print $3 }'
          done | sort -u | git -C "$dir" pack-objects -q --stdout > "$out" || rm -f "$out"
      }

      # When the build emits a -source companion, archive the finished checkout
      # for it, named as the cache names it so the companion's upstream
      # directory can stand in for the clone. Beside the archive go the raw
      # commit and tag objects and the gitlinks of the tree, so the restore
      # path can give the tree its real name rather than a synthetic one.
      # git archive stops at gitlinks, so submodules are archived one by one
      # and listed for the restore path.
      stash_source() {
          local dest=$1 expcommit=$2 repo=$3 recurse=$4 tag=$5
          local stash="${MELANGE_SOURCE_STASH:-}" head="" key="" name=""
          [ -n "$stash" ] || return 0
          [ -d "$dest/.git" ] || dest=.
          [ -d "$dest/.git" ] || return 0
          head=$(git -C "$dest" rev-parse HEAD) || return 0
          key="git:${expcommit:-$head}"
          # restored from a companion: its archive is already in the stash
          [ -f "$stash/$key.tar.gz" ] && return 0
          name=$(basename "$repo" .git)
          mkdir -p "$stash"
          msg "archiving checkout as $key.tar.gz for the -source package"
          if ! archive_tree "$dest" "$name-$head/" "$stash/$key.tar.gz"; then
              msg "Warning: archiving the checkout failed; the -source package will not carry it"
              rm -f "$stash/$key.tar.gz"
              return 0
          fi
          # url, head, head's commit time, and the branch HEAD is on (empty
          # when detached, as a tag checkout leaves it): builds read .git/HEAD
          # the URL as provenance: scheme, host and path only, since userinfo,
          # query and fragment are where credentials travel
          printf '%s\n%s\n%s\n%s\n' "$(printf '%s' "$repo" | sed -e 's|://[^/@]*@|://|' -e 's|[?#].*$||')" "$head" "$(git -C "$dest" log -1 --format=%ct)" \
              "$(git -C "$dest" symbolic-ref --short -q HEAD || true)" > "$stash/$key.uri"
          git -C "$dest" cat-file commit "$head" > "$stash/$key.commit" || rm -f "$stash/$key.commit"
          # the commits the checkout stacked on the expected one (cherry-picks)
          # and the expected commit itself, so a restored repository has the
          # same shape and `git describe` measures the same distance to the tag
          if [ -n "$expcommit" ] && [ "$head" != "$expcommit" ]; then
              for c in $(git -C "$dest" rev-list "$head" "^$expcommit" 2>/dev/null) "$expcommit"; do
                  [ "$c" = "$head" ] && continue
                  git -C "$dest" cat-file commit "$c" > "$stash/$key.obj.$c" || rm -f "$stash/$key.obj.$c"
              done
          fi
          if [ -n "$tag" ] && [ "$(git -C "$dest" cat-file -t "refs/tags/$tag" 2>/dev/null)" = "tag" ]; then
              git -C "$dest" cat-file tag "refs/tags/$tag" > "$stash/$key.tag" || rm -f "$stash/$key.tag"
          fi
          stash_describe_history "$dest" "$stash" "$key" "$head"
          # Tree objects for HEAD and, so that `git log -- <path>` can walk it,
          # for the stashed ancestry too (one pack, shared subtrees stored
          # once; ancestors beyond a few hundred commits go without).
          set -- HEAD
          for f in "$stash/$key".obj.*; do
              [ -f "$f" ] || continue
              [ $# -le 300 ] && set -- "$@" "${f##*.obj.}"
          done
          stash_trees "$dest" "$stash/$key.trees" "$@"
          # every gitlink, checked out or not, as "path commit"
          git -C "$dest" ls-tree -r HEAD | awk '$2 == "commit" { print $4, $3 }' > "$stash/$key.gitlinks"
          if [ "$recurse" = "true" ]; then
              # one archive per checked-out path: the same commit may be
              # checked out at two paths, so path, not commit, names it
              : > "$stash/$key.submodules"
              git -C "$dest" submodule foreach --recursive --quiet 'echo "$displaypath $sha1"' |
              while read -r subpath subsha; do
                  [ -n "$subpath" ] || continue
                  subkey="$key.sub.$(printf '%s' "$subpath" | sha256sum | cut -c1-16)"
                  if archive_tree "$dest/$subpath" "$subpath/" "$stash/$subkey.tar.gz"; then
                      printf '%s %s %s\n' "$subpath" "$subkey.tar.gz" "$subsha" >> "$stash/$key.submodules"
                      git -C "$dest/$subpath" cat-file commit HEAD > "$stash/$subkey.commit" || rm -f "$stash/$subkey.commit"
                      stash_trees "$dest/$subpath" "$stash/$subkey.trees" HEAD
                      git -C "$dest/$subpath" ls-tree -r HEAD | awk -v p="$subpath/" '$2 == "commit" { print p $4, $3 }' >> "$stash/$key.gitlinks"
                  else
                      msg "Warning: archiving submodule $subpath failed"
                      rm -f "$stash/$subkey.tar.gz"
                  fi
              done
          fi
      }

      # The history `git describe` walks from HEAD: every commit down to the
      # nearest tag it would name, that tagged commit, and every tag on any
      # of them. Commit and tag objects only (no trees), a few hundred bytes
      # each; skipped when a repository is thousands of commits past its
      # last tag. Builds derive versions from `git describe` (gnulib's
      # git-version-gen: wget, coreutils, grep), and would otherwise see
      # only HEAD.
      stash_describe_history() {
          local dir=$1 stash=$2 key=$3 head=$4 desc="" base="" n="" c="" name="" type="" obj="" target=""
          desc=$(git -C "$dir" describe --tags --long HEAD 2>/dev/null) || desc=""
          if [ -n "$desc" ]; then
              base=$(git -C "$dir" rev-parse "${desc%-*-g*}^{commit}" 2>/dev/null) || base=""
              n=$(git -C "$dir" rev-list --count HEAD "^$base" 2>/dev/null) || n=999999
              if [ -n "$base" ] && [ "$n" -le 2000 ]; then
                  for c in $(git -C "$dir" rev-list HEAD "^$base") "$base"; do
                      [ "$c" = "$head" ] && continue
                      [ -f "$stash/$key.obj.$c" ] ||
                          git -C "$dir" cat-file commit "$c" > "$stash/$key.obj.$c" || rm -f "$stash/$key.obj.$c"
                  done
              fi
          fi
          : > "$stash/$key.tags"
          git -C "$dir" for-each-ref refs/tags --format='%(refname:short) %(objecttype) %(objectname) %(*objectname)' |
          while read -r name type obj target; do
              c=$target; [ "$type" = "commit" ] && c=$obj
              [ "$c" = "$head" ] || [ -f "$stash/$key.obj.$c" ] || continue
              if [ "$type" = "tag" ]; then
                  git -C "$dir" cat-file tag "$obj" > "$stash/$key.tagobj.$obj" || { rm -f "$stash/$key.tagobj.$obj"; continue; }
                  printf '%s tag %s %s\n' "$name" "$obj" "$c" >> "$stash/$key.tags"
              else
                  printf '%s commit %s\n' "$name" "$c" >> "$stash/$key.tags"
              fi
          done
      }

      # Name the restored tree, and authenticate it. A git object's name is
      # its content: writing the stashed raw commit object back over the
      # restored tree yields a commit whose name binds the tree, parents,
      # author and message. The archive is accepted only if that name is
      # expected-commit -- or, with cherry-picks, if a chain of restored
      # commits, each the `cherry-pick -x` of a configured hash, leads from
      # it to expected-commit. A cache that does not authenticate to what
      # the configuration pins is rejected, exactly as fetch rejects a cached
      # tarball whose checksum does not match; nothing in the cache is
      # trusted by its name. HEAD, `rev-parse`, `describe` and
      # setuptools-scm's node then read as they did against the clone.
      # Parents beyond the restored objects are absent, as in the depth-1
      # clone, so the repository is shallow.
      restore_head() {
          local cachebase=$1 expcommit=$2 tag=$3 initial=$4 cpicksf=$5 parent=$6
          local tree="" want="" sha="" f="" c="" p="" known=""
          [ -f "$cachebase.commit" ] ||
              { msg "$cachebase.commit is missing; the archive cannot be authenticated"; return 1; }
          want=$(sed -n 's/^tree //p;1q' "$cachebase.commit")
          if [ -f "$cachebase.trees" ] && git unpack-objects -q < "$cachebase.trees" 2>/dev/null &&
             git cat-file -e "$want" 2>/dev/null; then
              # The tree objects are named by the commit and name every blob:
              # read them as the index, then check the file the archive
              # delivered for each entry against its blob.
              git read-tree "$want" || return 1
              verify_worktree || return 1
              tree=$want
          else
              # No tree objects (an older companion): index the work tree and
              # compare the tree it makes. Clean filters (text=auto, eol,
              # ident) may map the bytes differently from what upstream
              # committed, so try git's mapping first and the raw bytes second.
              git add -A -f . && add_gitlinks "$cachebase" "$parent" || return 1
              tree=$(git write-tree) || return 1
              if [ "$tree" != "$want" ]; then
                  mkdir -p "$(git rev-parse --git-dir)/info"
                  printf '* -text -eol -ident -filter\n' >> "$(git rev-parse --git-dir)/info/attributes"
                  git add -A -f --renormalize . 2>/dev/null || return 1
                  tree=$(git write-tree) || return 1
              fi
              [ "$tree" = "$want" ] ||
                  { msg "restored tree $tree is not the tree of the stashed commit ($want); the archive does not match it"; return 1; }
          fi
          sha=$(git hash-object -t commit -w --literally --stdin < "$cachebase.commit") &&
          git update-ref HEAD "$sha" || return 1
          # the ancestry the checkout carried (cherry-picks and the commit
          # they sit on): their trees are absent, which git tolerates for
          # everything that walks commits -- describe, log, rev-list
          known=" $sha "
          for f in "$cachebase".obj.*; do
              [ -f "$f" ] || continue
              c=$(git hash-object -t commit -w --literally --stdin < "$f") && known="$known$c "
          done
          # A recipe may pin the annotated tag object rather than the commit
          # (git-checkout allows it, with a warning). The tag object is
          # content-addressed too: if the stashed one hashes to expected-commit,
          # the commit it names is what the recipe pinned.
          if [ -f "$cachebase.tag" ] && [ "$(git hash-object -t tag --literally --stdin < "$cachebase.tag")" = "$expcommit" ]; then
              expcommit=$(sed -n 's/^object //p;1q' "$cachebase.tag")
              msg "expected-commit named the tag object; it names commit $expcommit"
          fi
          authenticate_head "$sha" "$expcommit" "$cpicksf" "$known" || return 1
          msg "restored tree is upstream commit $sha"
          # shallow, as the clone was: every commit whose parents are absent
          : > "$(git rev-parse --git-dir)/shallow"
          for c in $known; do
              for p in $(git cat-file commit "$c" | awk '/^$/ { exit } /^parent / { print $2 }'); do
                  case "$known" in *" $p "*) ;; *) echo "$c" >> "$(git rev-parse --git-dir)/shallow"; break ;; esac
              done
          done
          recreate_tags "$cachebase" "$known" &&
          recreate_tag "$cachebase" "$tag" "$known" &&
          place_head "$cachebase" "$initial"
      }

      # Every tag the stash recorded on a restored commit: the tag object
      # itself when annotated (content-addressed, so its name is checked),
      # the ref alone when lightweight.
      recreate_tags() {
          local cachebase=$1 known=$2 name="" type="" obj="" target="" tsha=""
          [ -f "$cachebase.tags" ] || return 0
          while read -r name type obj target; do
              [ -n "$name" ] || continue
              if [ "$type" = "tag" ]; then
                  case "$known" in *" $target "*) ;; *) continue ;; esac
                  [ -f "$cachebase.tagobj.$obj" ] || continue
                  tsha=$(git hash-object -t tag -w --literally --stdin < "$cachebase.tagobj.$obj") || continue
                  [ "$tsha" = "$obj" ] && git update-ref "refs/tags/$name" "$tsha"
              else
                  case "$known" in *" $obj "*) git update-ref "refs/tags/$name" "$obj" ;; esac
              fi
          done < "$cachebase.tags"
          return 0
      }

      # Every regular file and symlink the index names must be in the work
      # tree with bytes that hash to its blob: raw, or through git's clean
      # filters (either way the check is content against the pinned tree;
      # only the mapping differs, and repositories mix them -- CRLF committed
      # under text=auto beside LF committed and checked out as CRLF). The
      # blobs are written, so the repository is complete. Files whose bytes
      # match only raw are marked assume-unchanged, as a clone's stat cache
      # would leave them, so status and describe --dirty read clean. Gitlinks
      # are checked by verify_submodules.
      verify_worktree() {
          local entries="" paths="" raw="" clean="" tab="" bad="" assume="" n=0 line="" mode="" sha="" path="" r="" c=""
          tab=$(printf '\t')
          entries=$(mktemp); paths=$(mktemp); raw=$(mktemp); clean=$(mktemp); bad=$(mktemp); assume=$(mktemp)
          git -c core.quotePath=false ls-files -s > "$entries"
          awk -F"$tab" '$1 ~ /^100(644|755) / { print $2 }' "$entries" > "$paths"
          if [ -s "$paths" ]; then
              git hash-object -w --no-filters --stdin-paths < "$paths" > "$raw" || return 1
              git hash-object -w --stdin-paths < "$paths" > "$clean" || return 1
          fi
          n=0
          while IFS="$tab" read -r meta path; do
              mode=${meta%% *}; sha=${meta#* }; sha=${sha%% *}
              case "$mode" in
                  100644|100755)
                      n=$((n + 1))
                      r=$(sed -n "${n}p" "$raw"); c=$(sed -n "${n}p" "$clean")
                      if [ "$r" = "$sha" ]; then
                          [ "$c" = "$sha" ] || printf '%s\n' "$path" >> "$assume"
                      elif [ "$c" != "$sha" ]; then
                          printf '%s\n' "$path" >> "$bad"
                      fi ;;
                  120000)
                      [ "$(printf '%s' "$(readlink "$path")" | git hash-object -w --stdin)" = "$sha" ] ||
                          printf '%s\n' "$path" >> "$bad" ;;
              esac
          done < "$entries"
          if [ -s "$bad" ]; then
              msg "restored files do not match the tree the commit names: $(head -3 "$bad" | tr '\n' ' ')$([ "$(wc -l < "$bad")" -gt 3 ] && echo '...')"
              rm -f "$entries" "$paths" "$raw" "$clean" "$bad" "$assume"
              return 1
          fi
          [ -s "$assume" ] && git update-index --assume-unchanged --stdin < "$assume"
          git update-index -q --refresh >/dev/null 2>&1 || true
          rm -f "$entries" "$paths" "$raw" "$clean" "$bad" "$assume"
      }

      # HEAD must be expected-commit, or reach it through first parents that
      # are, newest first, the `cherry-pick -x` of each configured hash --
      # every one present, none extra. Each step is a content-addressed
      # object already written, so a chain that ends at expected-commit
      # could only have been produced from the pinned source.
      authenticate_head() {
          local head=$1 expcommit=$2 cpicksf=$3 known=$4 c=$1 want="" hash="" line="" from=""
          if [ -n "$cpicksf" ] && [ -f "$cpicksf" ]; then
              while IFS= read -r line; do
                  line=${line%%#*}
                  [ -n "$line" ] || continue
                  hash=${line%%:*}; hash=${hash##*/}
                  want="$hash $want"
              done < "$cpicksf"
          fi
          while [ "$c" != "$expcommit" ]; do
              case "$known" in *" $c "*) ;; *) msg "commit $c is not among the restored objects"; return 1 ;; esac
              [ -n "$want" ] ||
                  { msg "restored HEAD $head does not reach expected-commit $expcommit"; return 1; }
              hash=${want%% *}; want=${want#"$hash"}; want=${want# }
              from=$(git cat-file commit "$c" | sed -n 's/^(cherry picked from commit \([0-9a-f]*\))$/\1/p' | tail -1)
              case "$from" in "$hash"*) ;; *) msg "commit $c is not the cherry-pick of configured $hash"; return 1 ;; esac
              c=$(git cat-file commit "$c" | awk '/^$/ { exit } /^parent / { print $2; exit }')
              [ -n "$c" ] || { msg "cherry-pick $hash has no parent"; return 1; }
          done
          [ -z "$want" ] ||
              { msg "cherry-pick(s) configured but absent from the restored history: $want"; return 1; }
      }

      # Every submodule's restored HEAD must be the gitlink its parent tree
      # records for that path. The parent was authenticated first, so this
      # ties the archive each submodule was restored from to the pinned tree
      # rather than to the file name that carried it.
      verify_submodules() {
          local cachebase=$1 dest=$2 subpath="" subfile="" parent="" other="" x="" rel="" want="" got=""
          [ -f "$cachebase.submodules" ] || return 0
          while read -r subpath subfile subsha; do
              [ -n "$subpath" ] || continue
              parent=""
              while read -r other x y; do
                  [ -n "$other" ] && [ "$other" != "$subpath" ] || continue
                  case "$subpath" in "$other"/*) [ ${#other} -gt ${#parent} ] && parent=$other ;; esac
              done < "$cachebase.submodules"
              rel=$subpath
              [ -z "$parent" ] || rel=${subpath#"$parent"/}
              want=$(git -C "$dest/$parent" rev-parse -q --verify "HEAD:$rel") ||
                  { msg "the tree records no gitlink at $subpath"; return 1; }
              got=$(git -C "$dest/$subpath" rev-parse -q --verify HEAD) || return 1
              [ "$want" = "$got" ] ||
                  { msg "submodule $subpath restored as $got but the tree pins $want"; return 1; }
          done < "$cachebase.submodules"
      }

      # Leave HEAD as the clone left it: on the branch the .uri sidecar names,
      # or detached (a tag checkout, a reset to a commit, a submodule). Builds
      # read .git/HEAD -- the git-version crate compiles its bytes in -- so
      # the shape matters, not just the commit. The scaffolding branch the
      # repository was initialised with goes away.
      place_head() {
          local cachebase=$1 initial=$2 sym="" repo="" when=""
          [ -f "$cachebase.uri" ] && sym=$(sed -n 4p "$cachebase.uri")
          if [ -n "$sym" ]; then
              if [ "$sym" != "$initial" ]; then
                  git branch -q -f "$sym" HEAD && git symbolic-ref HEAD "refs/heads/$sym" &&
                  git branch -q -D "$initial" || return 1
              fi
          else
              git checkout -q --detach && git branch -q -D "$initial" || return 1
          fi
          # one reflog line, shaped as a clone writes it (git-version's macro
          # takes .git/logs/HEAD and .git/index as compile-time inputs)
          if [ -f "$cachebase.uri" ]; then
              repo=$(sed -n 1p "$cachebase.uri"); when=$(sed -n 3p "$cachebase.uri")
              printf '%040d %s Melange Build <melange-build@cgr.dev> %s +0000\tclone: from %s\n' 0 "$(git rev-parse HEAD)" "${when:-0}" "$repo" > "$(git rev-parse --git-dir)/logs/HEAD"
          fi
      }

      # Recreate the tag the checkout used as upstream had it: the stashed tag
      # object itself when the commit it names was restored, otherwise an
      # annotated tag if upstream's was annotated and a lightweight one if not.
      # The kind matters: plain `git describe` sees only annotated tags, and
      # builds embed its output.
      recreate_tag() {
          local cachebase=$1 tag=$2 known=$3 p="" tsha=""
          [ -n "$tag" ] || return 0
          git show-ref -q --verify "refs/tags/$tag" && return 0 # already recreated from the stash
          if [ -f "$cachebase.tag" ]; then
              p=$(sed -n 's/^object //p;1q' "$cachebase.tag")
              case "$known" in
                  *" $p "*)
                      tsha=$(git hash-object -t tag -w --literally --stdin < "$cachebase.tag") &&
                      git update-ref "refs/tags/$tag" "$tsha"
                      return ;;
              esac
              git tag -a -m "$tag" "$tag"
          else
              git tag "$tag"
          fi
      }

      # Record in the index of the repository at $parent ("" for the
      # superproject) every gitlink the stash listed directly beneath it,
      # checked out or not, so the tree written matches upstream's. Gitlinks
      # inside a nested submodule belong to that one's index, not this one's.
      add_gitlinks() {
          local cachebase=$1 parent=$2 sub="" sha="" rel="" other="" x="" nested=""
          [ -f "$cachebase.gitlinks" ] || return 0
          while read -r sub sha; do
              [ -n "$sub" ] || continue
              if [ -z "$parent" ]; then rel=$sub
              else case "$sub" in "$parent"/*) rel=${sub#"$parent"/} ;; *) continue ;; esac
              fi
              nested=""
              while read -r other x; do
                  [ -n "$other" ] && [ "$other" != "$sub" ] && [ "$other" != "$parent" ] || continue
                  case "$sub" in "$other"/*) ;; *) continue ;; esac
                  case "$parent" in "$other"/*) continue ;; esac
                  nested=1
              done < "$cachebase.gitlinks"
              [ -z "$nested" ] || continue
              git update-index --add --cacheinfo "160000,$sha,$rel" || return 1
          done < "$cachebase.gitlinks"
      }

      # Recreate each submodule as a nested repository holding exactly its
      # archived paths, deepest first so a nested one exists before its
      # parent is named, each authenticated by restore_head against the
      # commit its archive is named for (verify_submodules then ties that
      # name to the parent's tree).
      restore_submodules() {
          local cachebase=$1 dest=$2 subpath="" subfile="" subsha=""
          [ -f "$cachebase.submodules" ] || return 0
          awk '{ n = gsub("/", "/", $1); print n, $0 }' "$cachebase.submodules" | sort -rn | cut -d' ' -f2- |
          while read -r subpath subfile subsha; do
              [ -n "$subpath" ] && [ -n "$subsha" ] || continue
              ( cd "$dest/$subpath" &&
                rm -rf .git &&
                git init -q -b main . &&
                git config --global --add safe.directory "$(pwd)" &&
                restore_head "/var/cache/melange/${subfile%.tar.gz}" "$subsha" "" main "" "$subpath" ) ||
                  { msg "submodule $subpath does not authenticate to $subsha"; exit 1; }
          done || return 1
      }

      main() {
          local repo=$1 dest=${2:-.} depth=${3:-"unset"} branch=$4
          local tag=$5 expcommit=$6 recurse=${7:-false}
          local cherry_pick="$8" sparse_paths="$9"
          local max_retries="${10:-3}" initial_backoff="${11:-2}" max_backoff="${12:-60}"
          local shallow_submodules="${13:-false}" submodule_jobs="${14:-1}"
          local expected_commit_is_branch_tip="${15:-false}"
          msg "repo='$repo' dest='$dest' depth='$depth' branch='$branch'" \
              "tag='$tag' expcommit='$expcommit' recurse='$recurse'" \
              "sparse_paths='$sparse_paths' max_retries='$max_retries'" \
              "initial_backoff='$initial_backoff' max_backoff='$max_backoff'" \
              "shallow_submodules='$shallow_submodules' submodule_jobs='$submodule_jobs'" \
              "expected_commit_is_branch_tip='$expected_commit_is_branch_tip'"

          case "$recurse" in
              true|false) :;;
              *) fail "recurse must be true or false, not '$recurse'"
          esac
          case "$shallow_submodules" in
              true|false) :;;
              *) fail "shallow_submodules must be true or false, not '$shallow_submodules'"
          esac
          case "$expected_commit_is_branch_tip" in
              true|false) :;;
              *) fail "expected-commit-is-branch-tip must be true or false," \
                      "not '$expected_commit_is_branch_tip'"
          esac

          [ -n "$repo" ] || fail "repository not provided"

          if [ -z "$branch" ] && [ -z "$tag" ]; then
              msg "Warning: you have not specified a branch or tag."
          elif [ -n "$branch" ] && [ -n "$tag" ]; then
              fail "both branch ($branch) and tag ($tag) are specified."
          fi

          if [ "$expected_commit_is_branch_tip" = "true" ]; then
              [ -z "$tag" ] ||
                  fail "expected-commit-is-branch-tip is only valid with" \
                       "'branch', not 'tag'."
              [ -n "$branch" ] ||
                  fail "expected-commit-is-branch-tip requires 'branch' to be set."
              [ -n "$expcommit" ] ||
                  fail "expected-commit-is-branch-tip requires 'expected-commit'" \
                       "to be set."
          fi

          [ -n "$expcommit" ] ||
              msg "Warning: no expected-commit"

          # A -source companion's upstream directory is a valid --cache-dir:
          # if it holds this checkout, restore it instead of cloning. The
          # archive already includes any cherry-picks. Only builds that ask
          # for it (MELANGE_SOURCE_RESTORE: those emitting a companion, or a
          # rebuild from one) take this path, so an ordinary build never
          # silently switches from a fresh clone to a rebuilt repository.
          local cachebase="/var/cache/melange/git:$expcommit" cachef="/var/cache/melange/git:$expcommit.tar.gz"
          if [ -n "${MELANGE_SOURCE_RESTORE:-}" ] && [ -n "$expcommit" ] && [ -f "$cachef" ]; then
              msg "found $cachef in cache; restoring instead of cloning"
              # Rebuild the checkout in a staging directory of its own, as the
              # clone path clones into one, then lay it into the destination
              # the same way. The destination may be the whole workspace, and
              # what the archive holds must never be guessed from a listing.
              local stage; stage=$(mktemp -d)
              tar -xzf "$cachef" --strip-components=1 --no-same-owner -C "$stage" ||
                  fail "restoring $cachef failed"
              if [ -f "$cachebase.submodules" ]; then
                  while read -r subpath subfile subsha; do
                      [ -n "$subpath" ] || continue
                      tar -xzf "/var/cache/melange/$subfile" --no-same-owner -C "$stage" ||
                          fail "restoring submodule $subpath from $subfile failed"
                  done < "$cachebase.submodules"
              fi
              # git archive carries no .git, but builds routinely ask git
              # about the tree (gemspecs enumerate files with `git ls-files`,
              # setuptools-scm and `git describe` derive versions from it,
              # binaries embed `rev-parse HEAD`). Recreate a repository over
              # the archived tree and give it the upstream commit's own name
              # -- which is also what authenticates the archive against
              # expected-commit (restore_head). Nothing found in the cache is
              # trusted by its file name; a mismatch fails the build rather
              # than building from it. The identity and date below serve only
              # the annotated tag recreated when the stash holds no tag
              # object.
              local sdate=${SOURCE_DATE_EPOCH:-0}
              [ -f "$cachebase.uri" ] && sdate=$(sed -n 3p "$cachebase.uri")
              [ "${sdate:-0}" -ge 315532800 ] 2>/dev/null || sdate=315532800
              export GIT_AUTHOR_NAME="Melange Build" GIT_AUTHOR_EMAIL="melange-build@cgr.dev" \
                     GIT_COMMITTER_NAME="Melange Build" GIT_COMMITTER_EMAIL="melange-build@cgr.dev" \
                     GIT_AUTHOR_DATE="@$sdate" GIT_COMMITTER_DATE="@$sdate"
              restore_submodules "$cachebase" "$stage" ||
                  fail "a submodule archive in the cache for $expcommit does not authenticate; refusing to build from it"
              # The archive is untrusted until restore_head authenticates it,
              # and git reads .git/config before anything else: a smuggled
              # config could name a clean filter that `git add` would run.
              # Start from no repository at all. Nested repositories become
              # gitlinks; gitlinks the clone never checked out are recorded
              # from the stash.
              ( cd "$stage" &&
                rm -rf .git &&
                git init -q -b "${branch:-main}" . &&
                git config --global --add safe.directory "$(pwd)" &&
                restore_head "$cachebase" "$expcommit" "$tag" "${branch:-main}" "$cherry_pick" "" ) ||
                  fail "$cachef does not authenticate to expected-commit $expcommit; refusing to build from it"
              verify_submodules "$cachebase" "$stage" ||
                  fail "a restored submodule is not the one the tree for $expcommit pins; refusing to build from it"
              mkdir -p "$dest"
              ( cd "$stage" && tar -c . ) | tar -C "$dest" -x --no-same-owner ||
                  fail "laying the restored checkout into $dest failed"
              rm -rf "$stage"
              git config --global --add safe.directory "$(realpath "$dest")"
              # Carry the archive and its sidecars (.uri, .commit, .tag,
              # .gitlinks, .submodules, .sub.*) into this build's own -source
              # package, so a rebuild's companion matches the original.
              if [ -n "${MELANGE_SOURCE_STASH:-}" ]; then
                  mkdir -p "$MELANGE_SOURCE_STASH"
                  cp "$cachebase".* "$MELANGE_SOURCE_STASH/"
              fi
              return 0
          fi

          local flags="" depthflag="" dest_fullpath="" workdir=""
          local remote="origin" rcfile="" rc="" quiet="--quiet"
          flags="--config=advice.detachedHead=false"
          [ -n "$branch" ] && flags="$flags --branch=$branch"
          [ -n "$tag" ] && flags="$flags --branch=$tag"
          if [ "$recurse" = "true" ] ; then
              flags="$flags --recurse-submodules --jobs=$submodule_jobs"
              [ "$shallow_submodules" = "true" ] && flags="$flags --shallow-submodules"
          fi
          [ -n "$sparse_paths" ] && flags="$flags --sparse --filter=blob:none"

          if [ "$depth" = "unset" ]; then
            depth=1
            if [ -n "$branch" ] && [ -n "$expcommit" ] &&
                [ "$expected_commit_is_branch_tip" = "false" ]; then
              # if we're just checking out a specific commit on a branch
              # then we need to get history, otherwise it will break
              # if the expected commit is not tip of the branch.
              # (when expected-commit-is-branch-tip is set we only compare
              # against the tip, so a shallow clone is sufficient.)
              depth=-1
            fi
          fi

          [ "$depth" = "-1" ] || depthflag="--depth=$depth"

          workdir=$(mktemp -d)
          rcfile=$(mktemp)
          mkdir -p "$dest"
          dest_fullpath=$(realpath "$dest")

          vr git config --global --add safe.directory "$workdir"
          vr git config --global --add safe.directory "$dest_fullpath"

          # Never spawn background maintenance: on git >= 2.47 every fetch
          # spawns 'git maintenance run --auto --detach', which daemonizes,
          # outlives this pipeline step, and races with later steps reading
          # .git (e.g. its lock file vanishing mid-tar).  The repo is
          # ephemeral, so auto maintenance has no value here.  gc.auto covers
          # code paths that still consult the legacy setting.
          vr git config --global maintenance.auto false
          vr git config --global gc.auto 0

          msg "Attempting git clone with retry (max_retries=$max_retries, initial_backoff=${initial_backoff}s, max_backoff=${max_backoff}s)"
          # shellcheck disable=SC2086
          retry_with_backoff "$max_retries" "$initial_backoff" "$max_backoff" \
              git clone $quiet "--origin=$remote" \
              "--config=user.name=Melange Build" \
              "--config=user.email=melange-build@cgr.dev" \
              $flags \
              ${depthflag:+"${depthflag}"} "$repo" "$workdir" ||
              fail "git clone failed after $max_retries retries"

          msg "cloned from $(cd "$workdir" && git remote get-url origin)"

          vr cd "$workdir"

          # Configure sparse-checkout if paths were provided
          if [ -n "$sparse_paths" ]; then
              msg "Configuring sparse-checkout with paths: $sparse_paths"
              # shellcheck disable=SC2086
              vr git sparse-checkout set --cone $sparse_paths ||
                  fail "failed to configure sparse-checkout --filter=blob:none"
          fi

          msg "tar -c . | tar -C \"$dest_fullpath\" -x"
          ( tar -c . ; echo $? > "$rcfile") | tar -C "$dest_fullpath" -x --no-same-owner
          # shellcheck disable=SC2162 # ash doesn't support read -f
          read rc < "$rcfile" || fail "failed to read rc file"
          [ "$rc" -eq 0 ] || fail "tar creation in $workdir failed"

          rm -rf "$workdir"
          vr cd "$dest_fullpath"
          vr git config --global --add safe.directory "$dest_fullpath"

          local foundcommit="" tagobj=""
          if [ -z "$tag" ]; then
              foundcommit=$(git rev-parse --verify HEAD)
              if [ -n "$expcommit" ] && [ "$expcommit" != "$foundcommit" ]; then
                  if [ "$expected_commit_is_branch_tip" = "true" ]; then
                      # the branch is being used as an immutable release
                      # pointer, so expected-commit must be its tip exactly.
                      fail "expected-commit $expcommit is not the tip of branch" \
                           "${branch:-HEAD} ($foundcommit); the branch advanced" \
                           "or the version was bumped without updating" \
                           "expected-commit"
                  elif [ "$depth" = "-1" ]; then
                      # depth=-1 is a full clone, so $foundcommit (the branch
                      # tip) has its complete history present.  Only reset to
                      # $expcommit if it is reachable from the tip; otherwise it
                      # belongs to a different/diverged branch and resetting
                      # would silently build stale code (e.g. the branch was
                      # bumped but expected-commit was not).
                      if git merge-base --is-ancestor "$expcommit" "$foundcommit"; then
                          msg "expected commit $expcommit on ${branch:-HEAD}," \
                              "got $foundcommit, performing reset"
                          vr git reset --hard "$expcommit"
                      else
                          fail "expected commit $expcommit is not reachable from" \
                               "${branch:-HEAD} (tip $foundcommit); the branch may" \
                               "have diverged from the pinned commit -- update" \
                               "expected-commit"
                      fi
                  else
                      fail "expected commit $expcommit on ${branch:-HEAD}," \
                           "got $foundcommit, set depth to -1 to attempt a reset"
                  fi
              fi
              msg "tip of ${branch:-HEAD} is commit $foundcommit"
              process_cherry_picks "$cherry_pick" || fail "failed to apply cherry-pick"
              return 0
          fi

          # git clone --branch=X will pick the branch X if there
          # exists both a tag and a branch by that name.
          # since a tag was given, we want the tag.
          # shellcheck disable=SC2086
          retry_with_backoff "$max_retries" "$initial_backoff" "$max_backoff" \
              vr git fetch $quiet $remote ${depthflag:+"${depthflag}"} --no-tags \
              "+refs/tags/$tag:refs/$remote/tags/$tag" ||
              fail "git fetch of tag $tag failed after $max_retries retries"
          vr git checkout $quiet "$remote/tags/$tag"

          foundcommit=$(git rev-parse --verify HEAD)
          if [ -z "$expcommit" ] || [ "$expcommit" = "$foundcommit" ]; then
              msg "tag $tag is $foundcommit"
          else
                # If it's a tag, then it could be a lightweight or annotated tag.
                # Lightweight tags point directly to the commit and do not have
                # any messages, signatures, or other data.  Annotated tags point
                # to its own git object containing the tag data, with a reference
                # to the underlying commit.  We expect most tags to be using
                # annotated tags.
                tagobj=$(git rev-parse --verify --end-of-options \
                    "refs/$remote/tags/$tag")
                if [ "$expcommit" != "$tagobj" ]; then
                    [ "$tagobj" != "$expcommit" ] &&
                        msg "tag object hash was $tagobj"
                    fail "Expected commit $expcommit for $tag, found $foundcommit"
                fi

                msg "Warning: The provided expected-commit ($expcommit)"
                msg "was the hash of the annotated tag object for $tag."
                msg "Update to set expected-commit to $foundcommit"
          fi

          process_cherry_picks "$cherry_pick" ||
                fail "failed to apply cherry-pick"

          return 0
      }

      cpickf=$(mktemp) || {
        echo "failed mktemp"
        exit 1
      }

      cat >"$cpickf" <<"END_CHERRY_PICKS"
      ${{inputs.cherry-picks}}
      END_CHERRY_PICKS

      main \
          "${{inputs.repository}}" "${{inputs.destination}}" \
          "${{inputs.depth}}" "${{inputs.branch}}" \
          "${{inputs.tag}}" "${{inputs.expected-commit}}" \
          "${{inputs.recurse-submodules}}" "$cpickf" \
          "${{inputs.sparse-paths}}" \
          "${{inputs.max-retries}}" "${{inputs.initial-backoff}}" \
          "${{inputs.max-backoff}}" \
          "${{inputs.shallow-submodules}}" "${{inputs.submodule-jobs}}" \
          "${{inputs.expected-commit-is-branch-tip}}"

      stash_source "${{inputs.destination}}" "${{inputs.expected-commit}}" \
          "${{inputs.repository}}" "${{inputs.recurse-submodules}}" "${{inputs.tag}}"

      rm -f "$cpickf"
