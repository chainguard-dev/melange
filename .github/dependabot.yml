version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    ignore:
      # From v1.20.4, compress encodes gzip differently, so every APK's
      # bytes change and `melange rebuild` of an APK built by an earlier
      # melange reports a digest diff. Bump it by hand, in a PR that calls
      # out the rebuild drift (see #2753).
      - dependency-name: github.com/klauspost/compress
    groups:
      gomod:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
