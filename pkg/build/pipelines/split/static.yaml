name: Split static library files

needs:
  packages:
    - busybox

inputs:
  package:
    description: |
      The package to split static library files from
    required: false

pipeline:
  - runs: |
      PACKAGE_DIR="${{targets.destdir}}"
      if [ -n "${{inputs.package}}" ]; then
        PACKAGE_DIR="${{targets.outdir}}/${{inputs.package}}"
      fi

      if [ "$PACKAGE_DIR" = "${{targets.contextdir}}" ]; then
        echo "ERROR: Package can not split files from itself!" && exit 1
      fi

      i= j=
      cd "$PACKAGE_DIR" || exit 0

      # Remove a directory and its parents while empty, stopping at a symlink.
      prune_empty_dirs() {
        _pd="${1#./}"
        _pd="${_pd%/}"
        while [ -n "$_pd" ] && [ "$_pd" != "." ] && [ -d "$_pd" ] && [ ! -L "$_pd" ] && [ -z "$(ls -A "$_pd")" ]; do
          rmdir "$_pd"
          case "$_pd" in
            */*) _pd="${_pd%/*}" ;;
            *) break ;;
          esac
        done
      }

      libdirs=usr/
      [ -d lib/ ] && libdirs="lib/ $libdirs"
      for i in \
        $(find $libdirs -name '*.a' 2>/dev/null); do
            if [ -e "$PACKAGE_DIR/$i" ] || [ -L "$PACKAGE_DIR/$i" ]; then
              d="${{targets.contextdir}}/${i%/*}" # dirname $i
              mkdir -p "$d"
              mv "$PACKAGE_DIR/$i" "$d"
              prune_empty_dirs "${i%/*}"
            fi
        done
