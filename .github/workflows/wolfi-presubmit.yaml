name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  build-melange:
    name: Build melange and add to artifact cache
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
          check-latest: true

      - name: build
        run: |
          make melange

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: melange-${{ github.run_id }}
          path: ${{ github.workspace }}/melange
          retention-days: 1

  build-packages:
    name: Build packages
    needs:
      - build-melange
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # This is a list of packages which covers basic and exotic uses of
    # the built-in pipelines.  Goal is to balance efficiency while also
    # exercising Melange with real-world package builds.
    # Feel free to add additional packages to this matrix which exercise
    # Melange in new ways (e.g. new pipelines, etc.)
    strategy:
      fail-fast: false
      matrix:
        # The bubblewrap leg runs as a Chainguard Check
        # (.chainguard/ci/e2e.yaml, wolfi-packages); QEMU needs KVM, which
        # check guests lack.
        runner:
          - qemu
        package:
          # - rust-1.86 # takes ~35-40 minutes to build; used for testing LICENSE file functionality
          #- gdk-pixbuf # Looks like this is broken again, see: https://gitlab.gnome.org/GNOME/gobject-introspection/-/issues/515
          #- glibc # takes ~35-40 minutes to build; not an all-encompassing signal of Melange functionality; TODO: replace with a smaller, related package
          #- xmlto # TODO: https://github.com/wolfi-dev/os/issues/26442
          - bubblewrap
          - dpkg
          - fixuid # uses a diff test user
          - fping # uses get/setcaps
          - gitsign
          - guac
          - jq # built with MELANGE_VERSIONED_SHLIB_DEPENDS=1 to exercise so-ver: depends
          - lzo
          - ncurses
          - perl-yaml-syck
          - postfix
          - py3-pyelftools # Uses license-path
          - py3-supported-python
          - s3cmd
          - subversion
          - sudo
          - tini

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
            _http._tcp.azure.archive.ubuntu.com:443
            _https._tcp.dl.google.com:443
            _https._tcp.esm.ubuntu.com:443
            _https._tcp.motd.ubuntu.com:443
            _https._tcp.packages.microsoft.com:443
            api.github.com:443
            api.ipify.org:443
            apk.cgr.dev:443
            archive.ubuntu.com:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:80
            broker.actions.githubusercontent.com:443
            cgr.dev:443
            classic.yarnpkg.com:443
            cpan.metacpan.org:443
            de.postfix.org:443
            dl-cdn.alpinelinux.org:443
            dl.google.com:443
            doc-10-as-docs.googleusercontent.com:443
            download.docker.com:443
            drive.google.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            ftp.de.debian.org:80
            ftp.fu-berlin.de:443
            ghcr.io:443
            git.dpkg.org:443
            github.com:443
            go.dev:443
            index.crates.io:443
            invisible-mirror.net:443
            motd.ubuntu.com:443
            objects.githubusercontent.com:443
            packages.microsoft.com:443
            packages.wolfi.dev:443
            pkg-containers.githubusercontent.com:443
            pkgs.alpinelinux.org:443
            proxy.golang.org:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            registry.yarnpkg.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            security.ubuntu.com:443
            security.ubuntu.com:80
            static.crates.io:443
            storage.googleapis.com:443
            sum.golang.org:443
            time1.google.com:123
            time2.google.com:123
            time2.google.com:443
            time3.google.com:123
            time3.google.com:443
            time4.google.com:123
            time4.google.com:443
            www.oberhumer.com:443
            www.sudo.ws:443
            yarnpkg.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wolfi-dev/os
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: melange-${{ github.run_id }}
          path: ${{ github.workspace }}/.melange-dir
          run-id: ${{ github.run_id }}

      - env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          sudo mv "${GITHUB_WORKSPACE}"/.melange-dir/melange /usr/bin/melange
          sudo chmod a+x /usr/bin/melange
          melange version

      # needed by the Test installable step
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0

      # Installs wolfictl 0.39.28 from the action's ghcr.io/wolfi-dev/sdk
      # digest. Keep in step with wolfictl in .chainguard/ci/e2e.yaml.
      - uses: wolfi-dev/actions/install-wolfictl@e67944ee870ccd65490539b08cae7ff5df9eca35

      - env:
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          wolfictl bump "${MATRIX_PACKAGE}"

      - name: Download kernel for VMs
        if: matrix.runner == 'qemu'
        run: |
          KERNEL_PKG="$(curl -sL https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/APKINDEX.tar.gz | tar -Oxz APKINDEX | awk -F':' '$1 == "P" {printf "%s-", $2} $1 == "V" {printf "%s.apk\n", $2}' | grep "linux-virt" | grep -v dev)"
          curl -LSo linux-virt.apk "https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/${KERNEL_PKG}"
          mkdir -p /tmp/kernel
          tar -xf ./linux-virt.apk -C /tmp/kernel/

      - name: Install QEMU/KVM
        if: matrix.runner == 'qemu'
        run: |
          sudo apt-get update
          sudo apt-get -y install qemu-system-x86-64 qemu-kvm

      - name: Enable KVM group perms
        if: matrix.runner == 'qemu'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make package ${{ matrix.package }} with QEMU Runner
        if: matrix.runner == 'qemu'
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          # Build jq with versioned shared library depends enabled, so that
          # the presubmit demonstrates so-ver: dependency generation on a
          # real package.  Empty means "off", which is how melange reads an
          # unset variable.
          MELANGE_VERSIONED_SHLIB_DEPENDS: ${{ matrix.package == 'jq' && '1' || '' }}
        run: |
          make \
            SHELL="/bin/bash" \
            QEMU_KERNEL_IMAGE=/tmp/kernel/boot/vmlinuz-virt \
            QEMU_KERNEL_MODULES=/tmp/kernel/lib/modules/ \
            MELANGE="/usr/bin/melange" \
            MELANGE_EXTRA_OPTS="--runner qemu --generate-provenance" \
            package/"${MATRIX_PACKAGE}"

      - name: Output SLSA provenance
        run: |
          for pkg in packages/x86_64/*.attest.tar.gz; do
            dir="$(basename "${pkg}" .attest.tar.gz)"
            sudo mkdir -p packages/x86_64/"${dir}"
            sudo tar --xattrs --xattrs-include='*.*' -xf "${pkg}" -C packages/x86_64/"${dir}"
            jq . packages/x86_64/"${dir}"/"${dir}.attestation"
          done

      - name: Run tests with QEMU runner
        if: matrix.runner == 'qemu'
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          make \
            SHELL="/bin/bash" \
            QEMU_KERNEL_IMAGE=/tmp/kernel/boot/vmlinuz-virt \
            QEMU_KERNEL_MODULES=/tmp/kernel/lib/modules/ \
            MELANGE="/usr/bin/melange" \
            MELANGE_EXTRA_OPTS="--runner qemu" \
            test/"${MATRIX_PACKAGE}"

      - name: Check package ${{ matrix.package }} xattrs for QEMU-built package
        if: matrix.runner == 'qemu' && matrix.package == 'fping'
        run: |
          for pkg in packages/x86_64/*.apk; do
            sudo tar --xattrs --xattrs-include='*.*' -xf "${pkg}" -C packages/x86_64/
          done
          getcap packages/x86_64/usr/sbin/fping

      - name: Check package ${{ matrix.package }} for mode bits
        if: matrix.package == 'sudo'
        run: |
          for pkg in packages/x86_64/*.apk; do
            sudo tar --xattrs --xattrs-include='*.*' -xf "${pkg}" -C packages/x86_64/
          done
          ls -hal packages/x86_64/usr/bin/sudo

      - name: Check package ${{ matrix.package }} for versioned shared library depends
        if: matrix.package == 'jq'
        run: |
          # jq links libonig and libc, and both providers publish versioned
          # so-ver: provides, so building with
          # MELANGE_VERSIONED_SHLIB_DEPENDS=1 should have produced matching
          # versioned depends, e.g.:
          #
          #   depend = so:libonig.so.5
          #   depend = so-ver:libonig.so.5>=6.9.10-r4
          #
          # The dynamic linker is not special: ld-linux-*.so gets a versioned
          # depend too, from the PT_INTERP of every executable.
          found=0
          for pkg in packages/x86_64/jq-*.apk; do
            echo "=== ${pkg} ==="
            depends="$(tar -Oxzf "${pkg}" .PKGINFO 2>/dev/null | grep '^depend = ' || true)"
            echo "${depends:-(no depends)}"
            if echo "${depends}" | grep -q '^depend = so-ver:'; then
              found=1
            fi
          done
          if [ "${found}" -ne 1 ]; then
            echo "::error::MELANGE_VERSIONED_SHLIB_DEPENDS=1 produced no so-ver: depends for jq"
            exit 1
          fi

      - name: Test installable
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          # Install the package we just built, then run a package-specific
          # check that its mode bits / xattrs / directories survived.
          install="sed 's|=.*||' -i /etc/apk/world; apk add --allow-untrusted -X ./packages/ packages/x86_64/${MATRIX_PACKAGE}-*.apk"
          case "${MATRIX_PACKAGE}" in
            fping)   verify="apk add libcap-utils; getcap /usr/sbin/fping";;
            sudo)    verify="ls -hal /usr/bin/sudo";;
            postfix) verify="ls -hal /var/spool/postfix; ls -hal /var/lib/postfix";;
            *)       verify="true";;
          esac
          docker run --rm -v "${PWD}":/work --workdir /work \
            cgr.dev/chainguard/wolfi-base /bin/sh -c "${install}; ${verify}"
