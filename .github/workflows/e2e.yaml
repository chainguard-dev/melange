name: e2e tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  SOURCE_DATE_EPOCH: 1669683910

permissions: {}

jobs:
  rebuild:
    name: rebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        cfg:
          # build and rebuild examples
          - cargo-build.yaml
          - gnu-hello.yaml
          - go-build.yaml
          - minimal.yaml
          - npm-install.yaml
          - pnpm-install.yaml

          - melange.yaml # special; builds melange itself

    container:
      image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      options: |
        --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor:unconfined

    # alpine has no bash, so the default 'bash' shell already falls back to sh.
    # Say so explicitly, so shellcheck lints these scripts as the shell that
    # actually runs them.
    defaults:
      run:
        shell: sh

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Fetch dependencies
        run: |
          apk upgrade -Ua
          apk add go cue-cli build-base git bubblewrap jq

      - name: Build melange
        run: |
          make melange
          ./melange keygen

      - name: Build package
        env:
          MATRIX_CFG: ${{ matrix.cfg }}
        run: |
          path="examples/${MATRIX_CFG}"
          if [ "${MATRIX_CFG}" = "melange.yaml" ]; then
            path="melange.yaml"
          fi
          ./melange build "${path}" --arch=x86_64 --namespace=wolfi

      # rebuild no longer takes the working directory as the source directory
      # by default; melange.yaml, which builds this checkout, still needs it.
      - name: Rebuild package
        env:
          MATRIX_CFG: ${{ matrix.cfg }}
        run: |
          if [ "${MATRIX_CFG}" = "melange.yaml" ]; then
            ./melange rebuild ./packages/x86_64/*.apk --source-dir=.
          else
            ./melange rebuild ./packages/x86_64/*.apk
          fi

      # The same package again, this time emitting its -source companion and
      # rebuilding from nothing but that companion: its overlay is the source
      # directory and its upstream artifacts are the cache, verified against
      # the .source.sha256 pin every APK of the build carries. The rebuilt
      # APKs, the re-emitted companion included, must match. melange.yaml is
      # left out: it builds from alpine edge, whose packages move between
      # the build and the rebuild, and the locked environment in
      # .melange.yaml then no longer resolves.
      - name: Build and rebuild from the -source package
        if: matrix.cfg != 'melange.yaml'
        env:
          MATRIX_CFG: ${{ matrix.cfg }}
        run: |
          path="examples/${MATRIX_CFG}"
          ./melange build "${path}" --arch=x86_64 --namespace=wolfi --source-package --out-dir=./packages-source
          companion=$(ls ./packages-source/x86_64/*-source-*.apk)
          ls -la ./packages-source/x86_64/
          ./melange rebuild ./packages-source/x86_64/*.apk --source-package "${companion}" --out-dir=./rebuilt-from-source

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          path: |
            packages/**
            rebuilt-packages/**
            packages-source/**
            rebuilt-from-source/**
          name: rebuild-${{matrix.cfg}}
