name: Split manpages

needs:
  packages:
    - busybox

inputs:
  package:
    description: |
      The package to split manpages from
    required: false

  paths:
    description: |
      Additional manual page directories to split, whitespace separated
      and relative to the package root. The three standard roots
      (usr/share/man, usr/local/share/man, usr/man) are always searched;
      these are searched as well.

      For software that installs its manuals outside those roots -- an
      LLVM toolchain under usr/lib/llvm-N/share/man, or a JDK under
      usr/lib/jvm/<jdk>/man.
    default: ""

  preserve-path:
    description: |
      Keep each manual page at the path it was installed to, rather than
      relocating it under usr/share/man in the subpackage.

      Relocating is the right default: it puts pages where man(1) looks.
      But it collapses every source directory onto one destination, so it
      cannot be used where several versions of the same software are meant
      to coexist. Every llvm-N package ships a page called scan-build.1,
      and openjdk-17 and openjdk-21 share 27 page names between them --
      relocating those into usr/share/man would make the doc subpackages
      conflict with each other instead of installing side by side.

      Set to "true" for that case. The pages stay where the software put
      them, which is also where its own tooling expects to find them.
    default: "false"

pipeline:
  - runs: |
      PACKAGE_DIR="${{targets.destdir}}"
      if [ -n "${{inputs.package}}" ]; then
        PACKAGE_DIR="${{targets.outdir}}/${{inputs.package}}"
      fi

      if [ "$PACKAGE_DIR" = "${{targets.contextdir}}" ]; then
        echo "ERROR: Package can not split files from itself!" && exit 1
      fi

      # Reject anything other than true/false rather than treating an
      # unexpected value as false, which would silently relocate pages the
      # caller asked to keep in place.
      case "${{inputs.preserve-path}}" in
        true|false) ;;
        *)
          echo "ERROR: preserve-path must be \"true\" or \"false\", got \"${{inputs.preserve-path}}\"" && exit 1
          ;;
      esac

      # Held relative to the package root, so one value names both the
      # source directory and, when preserving, the destination.
      for mandir in usr/share/man usr/local/share/man usr/man ${{inputs.paths}}; do
        [ -d "$PACKAGE_DIR/$mandir" ] || continue

        if [ "${{inputs.preserve-path}}" = "true" ]; then
          destdir="${{targets.contextdir}}/$mandir"
        else
          destdir="${{targets.contextdir}}/usr/share/man"
        fi

        # Merge into the destination rather than moving wholesale. Two
        # roots can each contain a man1/, and `mv src/man1 dest/` fails
        # with "File exists" once dest/man1 is there -- so a package
        # shipping pages in both usr/share/man and usr/local/share/man
        # could not be split at all.
        mkdir -p "$destdir"
        cp -a "$PACKAGE_DIR/$mandir"/. "$destdir"/
        rm -rf "$PACKAGE_DIR/$mandir"
        rmdir --parents --ignore-fail-on-non-empty "$(dirname "$PACKAGE_DIR/$mandir")" 2>/dev/null || true
      done
