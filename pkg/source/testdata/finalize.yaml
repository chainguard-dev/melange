package:
  name: finalize
  version: 0.0.1
  epoch: 0
  description: "an example with a source step in a finalize pipeline"
  copyright:
    - license: Not-Applicable

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://example.com/main.tar.gz
      expected-sha256: aa

finalize:
  - runs: echo "not a source step"

  - uses: git-checkout
    with:
      repository: https://example.com/finalize.git
      tag: v1
      expected-commit: abc123
